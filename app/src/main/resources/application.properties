spring.application.name=billing-service
logging.structured.format.console=logstash

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://tech:challenge_1234@localhost:27017/billing_db?authSource=admin}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:tech}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:challenge_1234}

# Actuator e Health Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.config-url=${SWAGGER_BASE_PATH:}/v3/api-docs/swagger-config
springdoc.swagger-ui.url=${SWAGGER_BASE_PATH:}/v3/api-docs
