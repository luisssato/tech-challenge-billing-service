spring.application.name=billing-service
logging.structured.format.console=logstash

# Amazon DynamoDB
dynamodb.table.name=${DYNAMODB_TABLE_NAME:tech-challenge-prod-billing-service-table}
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
dynamodb.gsi.payment=${DYNAMODB_PAYMENT_INDEX:payment-id-index}

# Amazon SQS 
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN:}
spring.cloud.aws.sqs.endpoint=${SQS_ENDPOINT:http://localhost:4566}
spring.cloud.aws.sqs.listener.auto-startup=${SQS_LISTENER_AUTO_STARTUP:true}
spring.cloud.aws.sqs.queue-not-found-strategy=FAIL
spring.cloud.aws.sqs.listener.max-concurrent-messages=${SQS_MAX_CONCURRENT:2}
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:2}

# Filas de Entrada SQS
billing.sqs.diagnostico-concluido=${SQS_DIAGNOSTICO_CONCLUIDO:billing-diagnostico-concluido}
billing.sqs.execucao-falhou=${SQS_EXECUCAO_FALHOU:billing-execucao-falhou}
billing.sqs.os-cancelada=${SQS_OS_CANCELADA:billing-os-cancelada}

# Fila de Saída SQS
billing.sqs.saida=${SQS_SAIDA:billing-events}

# Outbox Pattern
billing.outbox.enabled=${OUTBOX_ENABLED:true}
billing.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
billing.outbox.lote=${OUTBOX_LOTE:50}

# Actuator e Health Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.config-url=${SWAGGER_BASE_PATH:}/v3/api-docs/swagger-config
springdoc.swagger-ui.url=${SWAGGER_BASE_PATH:}/v3/api-docs

# Provedor de Pagamento (mock / mercadopago)
pagamento.provedor=${PAGAMENTO_PROVEDOR:mock}
mercadopago.base-url=${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
