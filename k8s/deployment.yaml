apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tech-challenge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: billing-service
          image: "IMAGE_PLACEHOLDER"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: DYNAMODB_TABLE_NAME
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: DYNAMODB_TABLE_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: AWS_SESSION_TOKEN
                  optional: true
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: MERCADO_PAGO_ACCESS_TOKEN
                  optional: true
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: AWS_REGION
            - name: PAGAMENTO_PROVEDOR
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: PAGAMENTO_PROVEDOR
            - name: MERCADO_PAGO_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: MERCADO_PAGO_BASE_URL
            - name: SWAGGER_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SWAGGER_BASE_PATH
            - name: SQS_DIAGNOSTICO_CONCLUIDO
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SQS_DIAGNOSTICO_CONCLUIDO
            - name: SQS_ORCAMENTO_APROVADO
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SQS_ORCAMENTO_APROVADO
            - name: SQS_EXECUCAO_FALHOU
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SQS_EXECUCAO_FALHOU
            - name: SQS_OS_CANCELADA
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SQS_OS_CANCELADA
            - name: SQS_SAIDA
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SQS_SAIDA
            - name: OUTBOX_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: OUTBOX_ENABLED
            - name: OUTBOX_INTERVALO_MS
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: OUTBOX_INTERVALO_MS
            - name: OUTBOX_LOTE
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: OUTBOX_LOTE
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
